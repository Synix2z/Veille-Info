name: Veille informatique

on:
  schedule:
    - cron: "0 6 * * *"   # 6h UTC = 7h à Paris en hiver, 8h en été
  workflow_dispatch:
    inputs:
      mode:
        description: "daily ou weekly"
        default: "weekly"
        type: choice
        options: [daily, weekly]

jobs:
  veille:
    runs-on: ubuntu-24.04
    timeout-minutes: 15   # coupe le job s'il se bloque
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lancer la veille
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "$(date -u +%u)" = "7" ]; then
            MODE=weekly
          else
            MODE=daily
          fi
          python veille.py --mode "$MODE"