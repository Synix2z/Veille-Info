name: Veille informatique

on:
  schedule:
    - cron: "0 7 * * *"   # tous les jours à 7h UTC = 8h à Paris (heure d'hiver)
  workflow_dispatch:
    inputs:
      mode:
        description: "daily ou weekly"
        default: "weekly"
        type: choice
        options: [daily, weekly]

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # coupe le job s'il se bloque
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lancer la veille
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "$(date -u +%u)" = "7" ]; then
            MODE=weekly
          else
            MODE=daily
          fi
          python veille.py --mode "$MODE"
